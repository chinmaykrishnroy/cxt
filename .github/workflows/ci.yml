name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Exercise synthetic retrieval ablations
        run: cargo run --locked --release -- --evaluate eval/ablation.json --output target/ablation-report.json
      - name: Exercise shared-state retrieval controls
        run: cargo run --locked --release -- --evaluate eval/relationships.json --output target/relationships-report.json
      - name: Exercise import-binding retrieval controls
        run: cargo run --locked --release -- --evaluate eval/bindings.json --output target/bindings-report.json
      - name: Retain retrieval validation reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: retrieval-validation-${{ matrix.os }}
          path: |
            target/ablation-report.json
            target/relationships-report.json
            target/bindings-report.json
          if-no-files-found: ignore

  quality:
    name: Tests and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --locked -- --help
      - run: cargo run --locked -- . --dry-run

