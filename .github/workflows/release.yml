name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable or vMAJOR.MINOR.PATCH-dev.N tag to rebuild without moving it; empty means build only'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      debian_version: ${{ steps.version.outputs.debian_version }}
    steps:
      - name: Validate requested tag syntax
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            [[ "$REQUESTED_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev\.[1-9][0-9]*)?$ ]] || { echo "Use an existing stable or vMAJOR.MINOR.PATCH-dev.N tag."; exit 1; }
          fi
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Validate package version and release tag
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-dev\.[1-9][0-9]*)?$ ]] || { echo "Use a numeric stable version or MAJOR.MINOR.PATCH-dev.N."; exit 1; }
          prerelease=false
          debian_version="$version"
          if [[ "$version" == *-dev.* ]]; then
            prerelease=true
            debian_version="${version/-dev./~dev.}"
          fi
          if [ -n "$RELEASE_TAG" ]; then
            test "$version" = "${RELEASE_TAG#v}" || { echo "Release tag must match Cargo.toml version."; exit 1; }
            test -f "docs/releases/$RELEASE_TAG.md" || { echo "Add versioned release notes before tagging."; exit 1; }
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "debian_version=$debian_version" >> "$GITHUB_OUTPUT"
      - run: cargo fmt -- --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            msvc_arch: x64_arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross toolchain
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test native binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nativeTriple = (rustc -vV | Select-String '^host: ').Line.Substring(6)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($nativeTriple -eq '${{ matrix.target }}') {
            cargo test --locked --all-targets
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $nativeBinary = './target/${{ matrix.target }}/release/cxt.exe'
            & $nativeBinary --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $nativeBinary --export-skill target/skill-smoke/SKILL.md --skill-agent codex
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $nativeBinary --evaluate eval/ablation.json --output target/ablation-report.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Output 'Cross-compiled asset; runtime validation requires the target platform.'
          }

      - name: Smoke test native binary on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          if [ "$host" = "${{ matrix.target }}" ]; then
            cargo test --locked --all-targets --target "${{ matrix.target }}"
            cargo run --locked --release --target "${{ matrix.target }}" -- --help
            cargo run --locked --release --target "${{ matrix.target }}" -- --export-skill target/skill-smoke/SKILL.md --skill-agent codex
            cargo run --locked --release --target "${{ matrix.target }}" -- --evaluate eval/ablation.json --output target/ablation-report.json
          else
            echo "Cross-compiled asset; runtime validation requires the target platform."
          fi

      - name: Package
        shell: bash
        env:
          CXT_PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
          CXT_DEBIAN_VERSION: ${{ needs.validate.outputs.debian_version }}
        run: |
          mkdir -p dist
          exe="target/${{ matrix.target }}/release/cxt"
          if [ "${{ runner.os }}" = "Windows" ]; then
            exe="${exe}.exe"
            cp "$exe" "dist/cxt-${{ matrix.target }}.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp "$exe" "dist/cxt-${{ matrix.target }}"
            chmod +x "dist/cxt-${{ matrix.target }}"
            tar -czf "dist/cxt-${{ matrix.target }}.tar.gz" -C dist "cxt-${{ matrix.target }}"
            mkdir -p "dist/cxt-macos"
            cp "$exe" "dist/cxt-macos/cxt"
            chmod +x "dist/cxt-macos/cxt"
            hdiutil create -volname cxt -srcfolder "dist/cxt-macos" -ov -format UDZO "dist/cxt-${{ matrix.target }}.dmg"
            rm -rf "dist/cxt-macos" "dist/cxt-${{ matrix.target }}"
          else
            cp "$exe" "dist/cxt-${{ matrix.target }}"
            tar -czf "dist/cxt-${{ matrix.target }}.tar.gz" -C dist "cxt-${{ matrix.target }}"
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
              deb_arch="amd64"
              [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && deb_arch="arm64"
              if [[ "$CXT_PACKAGE_VERSION" == *-dev.* ]]; then
                dpkg --compare-versions "$CXT_DEBIAN_VERSION" lt "${CXT_PACKAGE_VERSION%%-dev.*}"
              fi
              deb_root="dist/deb-root"
              mkdir -p "$deb_root/DEBIAN" "$deb_root/usr/bin"
              cp "dist/cxt-${{ matrix.target }}" "$deb_root/usr/bin/cxt"
              chmod 755 "$deb_root/usr/bin/cxt"
              printf 'Package: cxt\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: %s\nMaintainer: Chinmay Krishn Roy\nDescription: Fast AST-aware context packer for LLMs\n' "$CXT_DEBIAN_VERSION" "$deb_arch" > "$deb_root/DEBIAN/control"
              dpkg-deb --build "$deb_root" "dist/cxt_${CXT_PACKAGE_VERSION}_${deb_arch}.deb"
              rm -rf "$deb_root"
            fi
            rm "dist/cxt-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cxt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    permissions:
      contents: write
    needs: [validate, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    steps:
      - name: Checkout installer scripts
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Add installers and checksums
        shell: bash
        run: |
          cp install.sh dist/cxt-installer.sh
          cp install.ps1 dist/install.ps1
          cp skills/cxt/SKILL.md dist/cxt-SKILL.md
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          body_path: docs/releases/${{ inputs.release_tag || github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.validate.outputs.prerelease == 'true' && 'false' || 'true' }}

