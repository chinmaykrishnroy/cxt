name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            msvc_arch: x64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            msvc_arch: x64_arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 cross toolchain
        if: matrix.cross && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y crossbuild-essential-arm64
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          exe="target/${{ matrix.target }}/release/cxt"
          if [ "${{ runner.os }}" = "Windows" ]; then
            exe="${exe}.exe"
            cp "$exe" "dist/cxt-${{ matrix.target }}.exe"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp "$exe" "dist/cxt"
            chmod +x "dist/cxt"
            mkdir -p "dist/cxt-macos"
            mv "dist/cxt" "dist/cxt-macos/cxt"
            hdiutil create -volname cxt -srcfolder "dist/cxt-macos" -ov -format UDZO "dist/cxt-${{ matrix.target }}.dmg"
            rm -rf "dist/cxt-macos"
          else
            cp "$exe" "dist/cxt-${{ matrix.target }}"
            tar -czf "dist/cxt-${{ matrix.target }}.tar.gz" -C dist "cxt-${{ matrix.target }}"
            if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] || [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
              deb_arch="amd64"
              [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ] && deb_arch="arm64"
              deb_root="dist/deb-root"
              mkdir -p "$deb_root/DEBIAN" "$deb_root/usr/bin"
              cp "dist/cxt-${{ matrix.target }}" "$deb_root/usr/bin/cxt"
              chmod 755 "$deb_root/usr/bin/cxt"
              printf 'Package: cxt\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: %s\nMaintainer: Chinmay Krishn Roy\nDescription: Fast AST-aware context packer for LLMs\n' "${GITHUB_REF_NAME#v}" "$deb_arch" > "$deb_root/DEBIAN/control"
              dpkg-deb --build "$deb_root" "dist/cxt_${GITHUB_REF_NAME#v}_${deb_arch}.deb"
              rm -rf "$deb_root"
            fi
            rm "dist/cxt-${{ matrix.target }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cxt-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout installer scripts
        uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Add installers and checksums
        shell: bash
        run: |
          cp install.sh dist/cxt-installer.sh
          cp install.ps1 dist/install.ps1
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
