[package]
name = "cxt"
version = "0.1.0"
edition = "2021"
description = "Blazing fast, AST-aware context packer for LLMs"
authors = ["Chinmay Krishn Roy"]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
ignore = "0.4"
regex = "1.10"
arboard = "3.3"
tree-sitter = "0.20"
tree-sitter-python = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-rust = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "3.1.1"
indicatif = "0.18.6"
directories = "6.0.0"
toml = "1.1"
globset = "0.4"
ctrlc = "3.5"
tree-sitter-go = "0.20.0"
tree-sitter-c = "0.20.8"
tree-sitter-cpp = "0.20.5"
tree-sitter-java = "0.20.2"
tree-sitter-c-sharp = "0.20.0"
tree-sitter-ruby = "0.20.1"
tree-sitter-php = "0.20.0"
